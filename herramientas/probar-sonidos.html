<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Probar sonidos</title>
  <link rel="icon" href="data:,">
  <style>
    body { background: #0b1020; color: #e8ecf5; font-family: system-ui, sans-serif; margin: 0; padding: 16px; }
    h1 { font-size: 1.6rem; margin: 0 0 4px; }
    h2 { font-size: 1.1rem; margin: 24px 0 8px; color: #9fb3d9; }
    p { color: #9fb3d9; margin: 0 0 8px; }
    .botones { display: flex; flex-wrap: wrap; gap: 8px; }
    button { background: #1c2744; color: #e8ecf5; border: 2px solid #3a4a73; border-radius: 10px;
             padding: 10px 16px; font-size: 1rem; cursor: pointer; }
    button:hover { background: #283762; }
    button.sonando { border-color: #6dd3ff; box-shadow: 0 0 8px #6dd3ff88; }
    label { display: inline-flex; gap: 6px; align-items: center; margin-top: 8px; font-size: 1rem; }
    pre { background: #111a30; padding: 12px; border-radius: 8px; overflow-x: auto; font-size: 0.85rem; }
  </style>
</head>
<body>
  <h1>Probar sonidos</h1>
  <p>Haz clic en un botón para escuchar. Cambia los sonidos en <code>src/audio/efectos.js</code> y las canciones en <code>src/musica/</code>.</p>

  <h2>Canciones</h2>
  <div class="botones" id="canciones"></div>
  <label><input type="checkbox" id="mudo"> Silenciar</label>

  <h2>Efectos</h2>
  <div class="botones" id="efectos"></div>

  <h2>Revisar (para programadores)</h2>
  <p>Fabrica cada sonido sin tocarlo y mide qué tan fuerte es.</p>
  <div class="botones"><button id="analizar">Revisar todos los sonidos</button></div>
  <pre id="resultado"></pre>

  <script type="module" src="./probar-sonidos.js"></script>
</body>
</html>
